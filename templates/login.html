{% extends "base.html" %}

{% block title %}Вход | LogiTrans{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 500px;">
  <h2 class="card-header">Вход</h2>
  <div class="card-body">
    <form id="LogForm">
      <div class="row g-3">
        <div class="col-12">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" class="form-control" required minlength="5" maxlength="32" placeholder="example@email.com">
        </div>
        <div class="col-12">
          <label for="password" class="form-label">Пароль</label>
          <input type="password" id="password" class="form-control" required minlength="4" maxlength="16" placeholder="Введите пароль">
        </div>
      </div>
      <button class="btn btn-primary w-100 mt-4" id="sub-btn" type="submit">Войти</button>
    </form>
    <p id="response-message" class="text-center mt-3 text-muted"></p>
  </div>
</div>

<div class="modal fade" id="msgModal" tabindex="-1" aria-labelledby="msgModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <h4 id="response-modal" class="text-center"></h4>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='login.js') }}"></script>
{% endblock %}
