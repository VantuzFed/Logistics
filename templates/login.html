{% extends "base.html" %}


{% block content %}
    <div class="jumbotron">
        <h1 class="display-4">Страница Входа</h1>
        <hr class="my-4">


<div class="form-signin w-100 m-auto">
<form id="LogForm">
    <div class="row">
                <div class="form-group col-xs-6">
                    <label for="email" class="form-label">E-mail:</label>
                    <p><input type="email" id="email" class="form-control" required minlength="5" maxlength="32"></p>
                </div>
                <div class="form-group col-xs-6">
                    <label for="password" class="form-label">Пароль:</label>
                    <p><input type="password" id="password" class="form-control" required></p>
                </div>
        <p></p>
    </div>
<button class="btn btn-primary" id="sub-btn" type="submit">Войти</button>
</form>
    <p id="response-message" class="text-center"> </p>
</div>
<div class="modal fade" id="msgModal" tabindex="-1" aria-labelledby="msgModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <h4 id="response-modal" class="text-center"> </h4>
      </div>
    </div>
  </div>
</div>
         </div>
<script src="{{ url_for('static', filename='login.js') }}"></script>
{% endblock %}
