<!DOCTYPE html>
<html lang="ru" class="dark-theme"> <!-- По умолчанию темная тема -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>{% block title %}LogiTrans{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr@4.6.13/dist/l10n/ru.js"></script>
</head>
<body>
    <!-- Шапка -->
    <header>
        <div class="container">
            <a href="{{ url_for('index') }}" class="logo">LogiTrans</a>
            <nav class="nav-links">
                {% if not user.login %}
                    <a href="{{ url_for('register') }}" class="nav-link">Регистрация</a>
                    <a href="{{ url_for('login') }}" class="nav-link">Вход</a>
                {% else %}
                    <a href="{{ url_for('dashboard') }}" class="nav-link">Панель</a>
                    <div class="dropdown">
                        <button class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown">
                            {{ user.login }}
                        </button>
                        <ul class="dropdown-menu">
                            {% if user.acc_type == 'Admin' %}
                                <li><a class="dropdown-item" href="/admin_panel">Админ-панель</a></li>
                            {% endif %}
                            <li><a class="dropdown-item link" onclick="logout()">Выйти</a></li>
                        </ul>
                    </div>
                {% endif %}
            </nav>
        </div>
    </header>

    <!-- Основное содержимое -->
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
