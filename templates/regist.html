{% extends "base.html" %}


{% block content %}
    <div class="jumbotron">
        <h1 class="display-4">Страница Регистрации</h1>
        <hr class="my-4">


<div class="form-signin w-100 m-auto">
<form id="RegForm">
    <div class="row">
                <div class="form-group col-xs-6">
                    <label for="login" class="form-label">Логин:</label>
                    <p><input type="text" id="login" class="form-control" required minlength="3" maxlength="15"></p>
                </div>
                <div class="form-group col-xs-6">
                    <label for="email" class="form-label">E-mail:</label>
                    <p><input type="email" id="email" class="form-control" required minlength="5" maxlength="32"></p>
                </div>
                <div class="form-group col-xs-6">
                    <label for="password" class="form-label">Пароль:</label>
                    <p><input type="password" id="password" class="form-control" required minlength="4" maxlength="16">
</p>
                </div>
                <div class="form-group col-xs-6">
                    <label for="password-check" class="form-label">Подтвердите пароль:</label>
                    <p><input type="password" id="password-check" class="form-control" required minlength="4" maxlength="16"></p>
                </div>
        <p></p>
    </div>
<button class="btn btn-primary" id="sub-btn" type="submit">Зарегистрироваться</button>
</form>
    <p id="response-message" class="text-center"> </p>
</div>
<div class="modal fade" id="msgModal" tabindex="-1" aria-labelledby="msgModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <h4 id="response-modal" class="text-center"> </h4>
      </div>
    </div>
  </div>
</div>
         </div>
<script src="{{ url_for('static', filename='register.js') }}"></script>
{% endblock %}
