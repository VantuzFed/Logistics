{% extends "base.html" %}

{% block title %}Регистрация | LogiTrans{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 500px;">
  <h2 class="card-header">Регистрация</h2>
  <div class="card-body">
    <form id="RegForm">
      <div class="row g-3">
        <div class="col-12">
          <label for="login" class="form-label">Логин</label>
          <input type="text" id="login" class="form-control" required minlength="3" maxlength="15" placeholder="Ваш логин">
        </div>
        <div class="col-12">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" class="form-control" required minlength="5" maxlength="32" placeholder="example@email.com">
        </div>
        <div class="col-12">
          <label for="password" class="form-label">Пароль</label>
          <input type="password" id="password" class="form-control" required minlength="4" maxlength="16" placeholder="Пароль (A-Z, 0-9, min 1 uppercase & digit)">
        </div>
        <div class="col-12">
          <label for="password-check" class="form-label">Подтвердите пароль</label>
          <input type="password" id="password-check" class="form-control" required minlength="4" maxlength="16" placeholder="Повторите пароль">
        </div>
      </div>
      <button class="btn btn-primary w-100 mt-4" id="sub-btn" type="submit">Зарегистрироваться</button>
    </form>
    <p id="response-message" class="text-center mt-3 text-muted"></p>
  </div>
</div>

<div class="modal fade" id="msgModal" tabindex="-1" aria-labelledby="msgModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <h4 id="response-modal" class="text-center"></h4>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='register.js') }}"></script>
{% endblock %}
